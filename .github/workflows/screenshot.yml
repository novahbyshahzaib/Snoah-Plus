name: Screenshot

on:
    workflow_dispatch:

jobs:
    screenshot:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: "17"
        - uses: gradle/actions/setup-gradle@v3
          with:
            gradle-version: "8.7"
        - name: Build debug APK
          run: gradle assembleDebug --stacktrace
        - name: Run app in emulator and take screenshot
          uses: reactivecircus/android-emulator-runner@v2
          with:
            api-level: 34
            target: google_apis
            arch: x86_64
            profile: pixel_7
            disable-animations: true
            script: |
              adb install app/build/outputs/apk/debug/app-debug.apk
              adb shell pm grant com.snoah.plus android.permission.READ_MEDIA_AUDIO || true
              adb shell am start -n com.snoah.plus/.MainActivity
              sleep 8
              adb exec-out screencap -p > home.png
              ls -lh home.png
        - name: Upload screenshots
          uses: actions/upload-artifact@v4
          with:
            name: SnoahPlus-screenshots
            path: home.png
            if-no-files-found: error
